version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airdb
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]
  etl:
    build: .
    command: python -m etl.run_etl --loop
    env_file: .env
    depends_on: [db]
volumes:
  db-data:
